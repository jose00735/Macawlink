<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macawlink</title>
<link rel="icon" href="/icon.svg">
<style>
  :root {
    --bg: #0b0420; --bg2: #140834; --panel: rgba(23, 12, 54, .78); --line: #2c1b5e;
    --cyan: #00f0ff; --magenta: #ff2bd6; --violet: #7b2cff; --text: #e8e6ff; --dim: #9a93c9;
    --ok: #00f0a8; --warn: #ffc21a; --bad: #ff4d6d;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(255,43,214,.22), transparent 70%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
    background-attachment: fixed;
  }
  body::before { /* synthwave floor */
    content: ""; position: fixed; inset: auto 0 0 0; height: 38vh; pointer-events: none; opacity: .35; z-index: -1;
    background:
      linear-gradient(transparent 0 96%, var(--magenta) 96% 100%) 0 0 / 100% 36px,
      linear-gradient(90deg, transparent 0 98.5%, var(--magenta) 98.5% 100%) 0 0 / 64px 100%;
    transform: perspective(300px) rotateX(55deg); transform-origin: bottom;
    mask-image: linear-gradient(transparent, #000);
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 18px 28px;
    border-bottom: 1px solid var(--line); background: rgba(11,4,32,.6); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 2;
  }
  header img { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(0,240,255,.5)); }
  h1 { font: 700 20px var(--mono); letter-spacing: .14em; margin: 0; text-transform: uppercase; }
  h1 span { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.6); }
  .pill {
    margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(0,0,0,.3); font-family: var(--mono); font-size: 12.5px; max-width: 60%;
  }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); flex: none; }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .pill.bad .dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 28px 60px; display: grid; gap: 18px;
         grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35);
  }
  section.wide { grid-column: 1 / -1; }
  h2 { font: 600 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--magenta); margin: 0 0 14px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; font-family: var(--mono); text-align: right; overflow-wrap: anywhere; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid rgba(44,27,94,.6); }
  .row:first-of-type { border-top: 0; }
  label { color: var(--dim); }
  select, input[type=number] {
    background: #0e0628; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font: 13px var(--mono); min-width: 150px;
  }
  select:focus, input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0,240,255,.2); }
  input[type=range] { width: 170px; accent-color: var(--cyan); }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: #241548; border: 1px solid var(--line); transition: .15s; cursor: pointer; }
  .switch i::after { content: ""; position: absolute; width: 18px; height: 18px; top: 2px; left: 2px; border-radius: 50%; background: var(--dim); transition: .15s; }
  .switch input:checked + i { background: rgba(0,240,255,.18); border-color: var(--cyan); }
  .switch input:checked + i::after { left: 22px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .presets { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text); cursor: pointer;
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--violet); background: linear-gradient(180deg, #2a1466, #170a3c);
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.35); }
  button.ghost { border-color: var(--line); background: transparent; }
  .meter { height: 8px; border-radius: 4px; background: #1a0e3d; overflow: hidden; margin-top: 10px; }
  .meter b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--magenta)); transition: width .2s; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 10px 0 0; }
  .hint code { font-family: var(--mono); color: var(--cyan); }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 10px;
    font: 13px var(--mono); background: #2a0a2e; border: 1px solid var(--magenta); color: var(--text); opacity: 0; transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .badge { font: 11px var(--mono); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .badge.on { color: var(--ok); border-color: var(--ok); }
</style>
</head>
<body>
<header>
  <img src="/icon.svg" alt="">
  <h1>Macaw<span>link</span></h1>
  <div class="pill" id="pill"><i class="dot"></i><span id="msg">Connecting…</span></div>
</header>

<main>
  <section>
    <h2>Phone</h2>
    <dl>
      <dt>Device</dt><dd id="device">—</dd>
      <dt>Link</dt><dd id="link">—</dd>
      <dt>Round trip</dt><dd id="rtt">—</dd>
      <dt>Battery</dt><dd id="battery">—</dd>
      <dt>Temperature</dt><dd id="temp">—</dd>
    </dl>
  </section>

  <section>
    <h2>Macawlink Camera</h2>
    <dl>
      <dt>Virtual camera</dt><dd id="cam">—</dd>
      <dt>Used by an app</dt><dd id="inuse">—</dd>
      <dt>Phone stream</dt><dd id="vin">—</dd>
      <dt>Decoded</dt><dd id="vfps">—</dd>
      <dt>Bitrate</dt><dd id="vkbps">—</dd>
    </dl>
    <p class="hint" id="camhint"></p>
  </section>

  <section>
    <h2>Microphone</h2>
    <dl>
      <dt>Output</dt><dd id="aout">—</dd>
      <dt>Format</dt><dd id="afmt">—</dd>
      <dt>Latency</dt><dd id="alat">—</dd>
    </dl>
    <div class="meter"><b id="level"></b></div>
    <p class="hint" id="michint"></p>
  </section>

  <section class="wide">
    <h2>Presets</h2>
    <div class="presets" id="presets"></div>
  </section>

  <section>
    <h2>Video</h2>
    <div class="row"><label for="res">Resolution</label><select id="res"></select></div>
    <div class="row"><label for="fps">Frame rate</label><select id="fps"></select></div>
    <div class="row"><label for="codec">Codec</label>
      <select id="codec"><option value="h264">H.264</option><option value="hevc">HEVC (H.265)</option></select></div>
    <div class="row"><label for="bitrate">Bitrate</label>
      <select id="bitrate">
        <option value="0">Auto</option><option>1500</option><option>3000</option><option>6000</option>
        <option>10000</option><option>15000</option><option>20000</option><option>30000</option><option>40000</option>
      </select></div>
    <div class="row"><label for="rc">Rate control</label>
      <select id="rc"><option value="cbr">Constant (CBR)</option><option value="vbr">Variable (VBR)</option></select></div>
    <div class="row"><label for="lens">Lens</label>
      <select id="lens"><option value="back">Back</option><option value="front">Front (selfie)</option></select></div>
    <div class="row"><label for="zoom">Zoom <span id="zoomv" class="badge">1.0×</span></label>
      <input id="zoom" type="range" min="1" max="5" step="0.1"></div>
    <div class="row"><label for="mirror">Mirror</label><label class="switch"><input id="mirror" type="checkbox"><i></i></label></div>
    <div class="row"><label for="stab">Stabilization</label><label class="switch"><input id="stab" type="checkbox"><i></i></label></div>
    <div class="row"><label for="torch">Torch</label><label class="switch"><input id="torch" type="checkbox"><i></i></label></div>
  </section>

  <section>
    <h2>Audio</h2>
    <div class="row"><label for="aen">Microphone on</label><label class="switch"><input id="aen" type="checkbox"><i></i></label></div>
    <div class="row"><label for="rate">Sample rate</label><select id="rate"></select></div>
    <div class="row"><label for="ch">Channels</label>
      <select id="ch"><option value="1">Mono</option><option value="2">Stereo</option></select></div>
    <div class="row"><label for="fm">Packet size</label>
      <select id="fm"><option value="10">10 ms (lowest latency)</option><option value="20">20 ms</option></select></div>
    <div class="row"><label for="aec">Echo cancellation</label><label class="switch"><input id="aec" type="checkbox"><i></i></label></div>
    <div class="row"><label for="ns">Noise suppression</label><label class="switch"><input id="ns" type="checkbox"><i></i></label></div>
    <div class="row"><label for="agc">Auto gain</label><label class="switch"><input id="agc" type="checkbox"><i></i></label></div>
    <div class="row"><label for="gain">PC gain <span id="gainv" class="badge">0 dB</span></label>
      <input id="gain" type="range" min="-20" max="20" step="1"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const H = {"Content-Type": "application/json", "X-Macawlink": "1"};
const PRESET_LABEL = {low: "Low bandwidth · 480p", meeting: "Meeting · 720p30", max: "Max quality · 1080p60"};
let settings = null, built = false, editingUntil = 0;

function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 3500); }

function build(o) {
  $("res").innerHTML = o.resolutions.map(r => `<option value="${r[0]}x${r[1]}">${r[0]} × ${r[1]}</option>`).join("");
  $("fps").innerHTML = o.frame_rates.map(f => `<option>${f}</option>`).join("");
  $("rate").innerHTML = o.sample_rates.map(r => `<option value="${r}">${(r/1000).toString()} kHz</option>`).join("");
  $("presets").innerHTML = o.presets.map(p => `<button data-p="${p}">${PRESET_LABEL[p] || p}</button>`).join("") +
    `<button class="ghost" id="kf">Refresh picture</button>`;
  $("presets").onclick = async e => {
    const p = e.target.dataset.p;
    if (e.target.id === "kf") { await fetch("/api/keyframe", {method: "POST", headers: H}); toast("Keyframe requested"); return; }
    if (!p) return;
    const r = await fetch("/api/preset/" + p, {method: "POST", headers: H});
    if (r.ok) { settings = await r.json(); fill(); toast("Preset: " + (PRESET_LABEL[p] || p)); } else toast((await r.json()).error);
  };
  document.querySelectorAll("main select, main input").forEach(el => el.addEventListener("change", apply));
  $("zoom").addEventListener("input", () => $("zoomv").textContent = (+$("zoom").value).toFixed(1) + "×");
  $("gain").addEventListener("input", () => $("gainv").textContent = $("gain").value + " dB");
  built = true;
}

function fill() {
  const v = settings.video, a = settings.audio;
  $("res").value = v.width + "x" + v.height; $("fps").value = v.fps; $("codec").value = v.codec;
  $("bitrate").value = String(v.bitrate_kbps);
  if ($("bitrate").value !== String(v.bitrate_kbps)) { $("bitrate").insertAdjacentHTML("beforeend", `<option>${v.bitrate_kbps}</option>`); $("bitrate").value = v.bitrate_kbps; }
  $("rc").value = v.rate_control; $("lens").value = v.lens; $("zoom").value = v.zoom || 1;
  $("zoomv").textContent = (+(v.zoom || 1)).toFixed(1) + "×";
  $("mirror").checked = v.mirror; $("stab").checked = v.stabilization; $("torch").checked = v.torch;
  $("aen").checked = a.enabled; $("rate").value = a.sample_rate; $("ch").value = a.channels; $("fm").value = a.frame_ms;
  $("aec").checked = a.aec; $("ns").checked = a.ns; $("agc").checked = a.agc; $("gain").value = a.gain_db; $("gainv").textContent = a.gain_db + " dB";
}

async function apply() {
  editingUntil = Date.now() + 1500;
  const [w, h] = $("res").value.split("x").map(Number);
  const s = structuredClone(settings);
  Object.assign(s.video, { width: w, height: h, fps: +$("fps").value, codec: $("codec").value, bitrate_kbps: +$("bitrate").value,
    rate_control: $("rc").value, lens: $("lens").value, zoom: +$("zoom").value, mirror: $("mirror").checked,
    stabilization: $("stab").checked, torch: $("torch").checked });
  Object.assign(s.audio, { enabled: $("aen").checked, sample_rate: +$("rate").value, channels: +$("ch").value, frame_ms: +$("fm").value,
    aec: $("aec").checked, ns: $("ns").checked, agc: $("agc").checked, gain_db: +$("gain").value });
  const r = await fetch("/api/settings", {method: "POST", headers: H, body: JSON.stringify(s)});
  if (r.ok) settings = await r.json(); else { toast((await r.json()).error); fill(); }
}

function show(st) {
  const pill = $("pill");
  pill.className = "pill " + (st.phase === "streaming" ? "ok" : (st.phase === "no-adb" ? "bad" : ""));
  $("msg").textContent = st.message;
  $("device").textContent = st.device || "—";
  $("link").textContent = st.transport ? `${st.transport}${st.serial ? " · " + st.serial : ""}` : "—";
  $("rtt").textContent = st.rtt_ms ? st.rtt_ms.toFixed(1) + " ms" : "—";
  $("battery").textContent = st.phone.battery ? `${st.phone.battery}%${st.phone.charging ? " ⚡" : ""}` : "—";
  $("temp").textContent = st.phone.temp_c ? st.phone.temp_c.toFixed(1) + " °C" : "—";
  const c = st.camera;
  const mode = c.mode === "DirectShow" ? "WINDOWS 10 · DIRECTSHOW" : (c.mode ? "WINDOWS 11" : "");
  $("cam").innerHTML = c.registered ? `<span class="badge on">ACTIVE · ${mode}</span>` : `<span class="badge">NOT SET UP</span>`;
  $("inuse").textContent = c.in_use ? `${c.app_width}×${c.app_height} @ ${c.app_fps}` : "no";
  $("camhint").innerHTML = c.error ? c.error : (!c.registered ? "" : c.mode === "DirectShow"
    ? `Pick <code>Macawlink Camera</code> in Chrome, Edge, Zoom, Teams, Discord or OBS. Restart the browser once after setup. (The Windows 10 Camera app only lists real webcams.)`
    : `Pick <code>Macawlink Camera</code> in Teams, Zoom, Meet or OBS.`);
  const v = st.video;
  $("vin").textContent = v.width ? `${v.codec.toUpperCase()} ${v.width}×${v.height}` : "—";
  $("vfps").textContent = v.width ? v.fps.toFixed(1) + " fps" : "—";
  $("vkbps").textContent = v.bitrate_kbps ? (v.bitrate_kbps / 1000).toFixed(2) + " Mbps" : "—";
  const a = st.audio;
  $("aout").textContent = a.endpoint || "—";
  $("afmt").textContent = a.sample_rate ? `PCM ${a.sample_rate / 1000} kHz · ${a.channels === 2 ? "stereo" : "mono"}` : "—";
  $("alat").textContent = a.sample_rate ? a.queued_ms + " ms" : "—";
  $("level").style.width = a.sample_rate && a.level_db > -90 ? Math.max(0, Math.min(100, (a.level_db + 60) / 60 * 100)) + "%" : "0";
  $("michint").innerHTML = a.last_error ? a.last_error :
    (a.endpoint && /cable/i.test(a.endpoint) ? `In your call app pick <code>CABLE Output</code> as the microphone.` :
     (a.endpoint ? `In your call app pick <code>Macawlink Microphone</code>.` : ""));
}

async function tick() {
  try {
    const r = await fetch("/api/state");
    const s = await r.json();
    if (!built) build(s.options);
    if (Date.now() > editingUntil) { settings = s.settings; fill(); }
    show(s.status);
  } catch (e) {
    $("pill").className = "pill bad"; $("msg").textContent = "Macawlink is not running";
  }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
