<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Macawlink icon: skeuomorphic futuristic orb webcam, cyberpunk palette (neon cyan / magenta on deep violet) -->
  <defs>
    <!-- tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B0B3A"/>
      <stop offset="0.6" stop-color="#0D0522"/>
      <stop offset="1" stop-color="#05020F"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7B2CFF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7B2CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>

    <!-- gunmetal shell -->
    <radialGradient id="shell" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#8E93B5"/>
      <stop offset="0.25" stop-color="#4A4F6E"/>
      <stop offset="0.65" stop-color="#1D2033"/>
      <stop offset="1" stop-color="#07080F"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimLight2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>

    <!-- chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="0.35" stop-color="#9AA0BC"/>
      <stop offset="0.5" stop-color="#3A3E58"/>
      <stop offset="0.62" stop-color="#C9CEE6"/>
      <stop offset="1" stop-color="#4B4F6B"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3E58"/>
      <stop offset="0.3" stop-color="#E8ECFA"/>
      <stop offset="0.55" stop-color="#7C819E"/>
      <stop offset="1" stop-color="#2A2D42"/>
    </linearGradient>

    <!-- lens glass -->
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3A1E6E"/>
      <stop offset="0.45" stop-color="#14082E"/>
      <stop offset="1" stop-color="#020108"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#05121A"/>
      <stop offset="0.8" stop-color="#00A8C0"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </radialGradient>
    <radialGradient id="ledGrad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFE0F8"/>
      <stop offset="0.4" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#7A0063"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ===== tile ===== -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="256" cy="210" r="250" fill="url(#halo)"/>
    <!-- synthwave floor grid -->
    <g stroke="url(#gridFade)" stroke-width="2" fill="none" opacity="0.7">
      <line x1="16" y1="380" x2="496" y2="380"/>
      <line x1="16" y1="405" x2="496" y2="405"/>
      <line x1="16" y1="436" x2="496" y2="436"/>
      <line x1="16" y1="474" x2="496" y2="474"/>
      <line x1="256" y1="360" x2="256" y2="500"/>
      <line x1="256" y1="360" x2="160" y2="500"/>
      <line x1="256" y1="360" x2="352" y2="500"/>
      <line x1="256" y1="360" x2="64" y2="500"/>
      <line x1="256" y1="360" x2="448" y2="500"/>
      <line x1="256" y1="360" x2="-32" y2="500"/>
      <line x1="256" y1="360" x2="544" y2="500"/>
    </g>
  </g>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="url(#tileEdge)" stroke-width="4" opacity="0.85"/>
  <!-- tile top gloss -->
  <rect x="20" y="20" width="472" height="200" rx="104" fill="url(#gloss)"/>

  <!-- ===== cable with neon core ===== -->
  <path d="M356 300 C 430 320, 440 400, 388 430 S 300 470, 268 452" fill="none" stroke="#0A0616" stroke-width="16" stroke-linecap="round"/>
  <path d="M356 300 C 430 320, 440 400, 388 430 S 300 470, 268 452" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- ===== stand ===== -->
  <ellipse cx="256" cy="414" rx="116" ry="26" fill="#000" opacity="0.7" filter="url(#shadow)"/>
  <!-- underglow -->
  <ellipse cx="256" cy="412" rx="104" ry="18" fill="#00F0FF" opacity="0.8" filter="url(#bigGlow)"/>
  <!-- foot -->
  <ellipse cx="256" cy="404" rx="104" ry="26" fill="url(#chromeH)"/>
  <ellipse cx="256" cy="396" rx="104" ry="26" fill="url(#chrome)"/>
  <ellipse cx="256" cy="394" rx="86" ry="17" fill="#141628"/>
  <ellipse cx="256" cy="394" rx="86" ry="17" fill="none" stroke="#FF2BD6" stroke-width="2.5" filter="url(#glow)"/>
  <!-- neck -->
  <rect x="234" y="320" width="44" height="76" rx="10" fill="url(#chromeH)"/>
  <rect x="248" y="330" width="16" height="56" rx="6" fill="#0A0616"/>
  <rect x="252" y="334" width="8" height="48" rx="4" fill="#00F0FF" filter="url(#glow)"/>

  <!-- ===== orb shell ===== -->
  <circle cx="262" cy="226" r="134" fill="#000" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="256" cy="212" r="134" fill="url(#shell)"/>
  <!-- neon rim lights -->
  <circle cx="256" cy="212" r="132" fill="none" stroke="url(#rimLight)" stroke-width="5"/>
  <circle cx="256" cy="212" r="132" fill="none" stroke="url(#rimLight2)" stroke-width="5"/>
  <!-- panel seam -->
  <path d="M124 212 A132 40 0 0 0 388 212" fill="none" stroke="#05060C" stroke-width="3" opacity="0.8"/>
  <path d="M124 215 A132 40 0 0 0 388 215" fill="none" stroke="#8E93B5" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== lens assembly ===== -->
  <!-- chrome outer bezel -->
  <circle cx="256" cy="212" r="86" fill="url(#chrome)"/>
  <circle cx="256" cy="212" r="86" fill="none" stroke="#0A0616" stroke-width="3"/>
  <!-- knurled ring -->
  <circle cx="256" cy="212" r="76" fill="#181A2B"/>
  <circle cx="256" cy="212" r="72" fill="none" stroke="#3A3E58" stroke-width="6" stroke-dasharray="3 4"/>
  <!-- neon cyan ring -->
  <circle cx="256" cy="212" r="64" fill="none" stroke="#00F0FF" stroke-width="5" filter="url(#glow)"/>
  <!-- glass -->
  <circle cx="256" cy="212" r="60" fill="url(#glass)"/>
  <!-- iris -->
  <circle cx="256" cy="212" r="32" fill="url(#iris)"/>
  <circle cx="256" cy="212" r="15" fill="#000"/>
  <!-- HUD ticks on the glass -->
  <g stroke="#00F0FF" stroke-width="2" opacity="0.55">
    <line x1="256" y1="156" x2="256" y2="168"/>
    <line x1="256" y1="256" x2="256" y2="268"/>
    <line x1="200" y1="212" x2="212" y2="212"/>
    <line x1="300" y1="212" x2="312" y2="212"/>
  </g>
  <!-- glass reflections -->
  <path d="M214 186 A50 50 0 0 1 252 158" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="282" cy="240" rx="10" ry="5" fill="#FF2BD6" opacity="0.6" transform="rotate(-35 282 240)"/>
  <circle cx="230" cy="196" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== status LED bar (magenta) ===== -->
  <rect x="226" y="98" width="60" height="14" rx="7" fill="#0A0616"/>
  <rect x="230" y="101" width="52" height="8" rx="4" fill="url(#ledGrad)" filter="url(#glow)"/>
  <!-- mic grille slots -->
  <g fill="#05060C" opacity="0.9">
    <rect x="216" y="316" width="16" height="4" rx="2"/>
    <rect x="240" y="320" width="32" height="4" rx="2"/>
    <rect x="280" y="316" width="16" height="4" rx="2"/>
  </g>

  <!-- shell specular highlight -->
  <ellipse cx="196" cy="128" rx="52" ry="22" fill="#FFFFFF" opacity="0.28" transform="rotate(-32 196 128)"/>
  <ellipse cx="186" cy="124" rx="18" ry="7" fill="#FFFFFF" opacity="0.55" transform="rotate(-32 186 124)"/>
</svg>
