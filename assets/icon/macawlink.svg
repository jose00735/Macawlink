<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Macawlink icon: an old-fashioned "eyeball" webcam on a desk stand, in macaw colours -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6FD1"/>
      <stop offset="1" stop-color="#0B3F86"/>
    </linearGradient>
    <radialGradient id="shell" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E9E4D6"/>
      <stop offset="1" stop-color="#B9B19C"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3B4A63"/>
      <stop offset="0.6" stop-color="#121826"/>
      <stop offset="1" stop-color="#05070C"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E4D6"/>
      <stop offset="1" stop-color="#A39A82"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- cable curling out of the back -->
  <path d="M352 300 C 420 320, 430 400, 380 430 S 300 470, 270 452"
        fill="none" stroke="#0A2E63" stroke-width="14" stroke-linecap="round"/>

  <!-- stand: neck + round foot -->
  <rect x="236" y="318" width="40" height="70" rx="12" fill="url(#base)"/>
  <ellipse cx="256" cy="410" rx="108" ry="30" fill="#082B5C" opacity="0.45"/>
  <ellipse cx="256" cy="398" rx="104" ry="28" fill="url(#base)"/>
  <ellipse cx="256" cy="392" rx="84" ry="16" fill="#F4F0E6" opacity="0.6"/>

  <!-- spherical camera shell -->
  <circle cx="256" cy="214" r="132" fill="url(#shell)"/>
  <circle cx="256" cy="214" r="132" fill="none" stroke="#8C836C" stroke-width="4"/>

  <!-- macaw yellow lens bezel -->
  <circle cx="256" cy="214" r="78" fill="#FFC21A"/>
  <circle cx="256" cy="214" r="78" fill="none" stroke="#C98F00" stroke-width="5"/>
  <!-- focus ring ticks -->
  <g stroke="#C98F00" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="142" x2="256" y2="152"/>
    <line x1="256" y1="276" x2="256" y2="286"/>
    <line x1="184" y1="214" x2="194" y2="214"/>
    <line x1="318" y1="214" x2="328" y2="214"/>
  </g>

  <!-- glass -->
  <circle cx="256" cy="214" r="56" fill="url(#lens)"/>
  <circle cx="256" cy="214" r="30" fill="#1F2C44"/>
  <circle cx="256" cy="214" r="14" fill="#05070C"/>
  <ellipse cx="236" cy="192" rx="16" ry="10" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 236 192)"/>
  <circle cx="276" cy="236" r="5" fill="#FFFFFF" opacity="0.35"/>

  <!-- macaw red "on air" LED + mic grille -->
  <circle cx="256" cy="110" r="11" fill="#E8262B"/>
  <circle cx="252" cy="106" r="4" fill="#FFB3B3"/>
  <g fill="#8C836C">
    <circle cx="214" cy="318" r="4"/><circle cx="230" cy="324" r="4"/>
    <circle cx="282" cy="324" r="4"/><circle cx="298" cy="318" r="4"/>
  </g>

  <!-- shell gloss -->
  <path d="M170 150 A 110 110 0 0 1 250 98" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
</svg>
